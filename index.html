<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Sederhana | Workshop Desain Web</title>
    <style>
        :root {
            --primary-kampus: #023269;
            --accent-kampus: #f3c907;
            --bg-color: #f4f7f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .calc-card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            overflow: hidden;
            border: 2px solid #e2e8f0;
        }

        .calc-header {
            background-color: var(--primary-kampus);
            color: #ffffff;
            padding: 20px;
            text-align: center;
            border-bottom: 4px solid var(--accent-kampus);
        }

        .calc-header h2 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .calc-header p {
            font-size: 0.85rem;
            color: var(--accent-kampus);
        }

        .calc-body {
            padding: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: var(--primary-kampus);
            font-size: 0.9rem;
        }

        .form-control {
            width: 100%;
            padding: 10px 14px;
            font-size: 1rem;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: var(--primary-kampus);
        }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 20px 0;
        }

        .btn-op {
            background-color: var(--primary-kampus);
            color: #ffffff;
            border: none;
            padding: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-op:hover {
            background-color: #011f43;
            transform: translateY(-2px);
        }

        .btn-reset {
            width: 100%;
            background-color: var(--accent-kampus);
            color: var(--primary-kampus);
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-reset:hover {
            background-color: #d8b206;
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #e2e8f0;
            border-radius: 8px;
            text-align: center;
            border-left: 5px solid var(--primary-kampus);
        }

        .result-box h4 {
            font-size: 0.9rem;
            color: #475569;
            margin-bottom: 5px;
        }

        .result-box div {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--primary-kampus);
            word-break: break-all;
        }

        .footer-text {
            text-align: center;
            padding: 12px;
            font-size: 0.75rem;
            color: #64748b;
            background-color: #f8fafc;
            border-top: 1px solid #e2e8f0;
        }
    </style>

    <script>
        function hitung(operator) {
            var val1 = document.getElementById("angka1").value;
            var val2 = document.getElementById("angka2").value;
            var elemHasil = document.getElementById("hasilKalkulasi");

            // Validasi Input Kosong
            if (val1 === "" || val2 === "") {
                alert("Harap masukkan kedua angka terlebih dahulu!");
                return;
            }

            var num1 = parseFloat(val1);
            var num2 = parseFloat(val2);
            var hasil = 0;

            switch (operator) {
                case '+':
                    hasil = num1 + num2;
                    break;
                case '-':
                    hasil = num1 - num2;
                    break;
                case '*':
                    hasil = num1 * num2;
                    break;
                case '/':
                    if (num2 === 0) {
                        alert("Error: Pembagian dengan angka nol tidak terdefinisi!");
                        elemHasil.innerText = "Error (Div by 0)";
                        return;
                    }
                    hasil = num1 / num2;
                    break;
                default:
                    return;
            }

            elemHasil.innerText = hasil;
        }
    </script>
</head>

<body>

    <div class="calc-card">
        <div class="calc-header">
            <h2>Kalkulator Sederhana</h2>
            <p>Praktikum Modul 09: JavaScript Ke-01</p>
        </div>

        <div class="calc-body">
            <div class="form-group">
                <label for="angka1">Angka Pertama (Input 1):</label>
                <input type="number" id="angka1" class="form-control" placeholder="Masukkan angka...">
            </div>

            <div class="form-group">
                <label for="angka2">Angka Kedua (Input 2):</label>
                <input type="number" id="angka2" class="form-control" placeholder="Masukkan angka...">
            </div>

            <label style="font-weight:600; color:var(--primary-kampus); font-size:0.9rem;">Pilih Operasi:</label>
            <div class="btn-grid">
                <button type="button" class="btn-op" onclick="hitung('+')">+</button>
                <button type="button" class="btn-op" onclick="hitung('-')">-</button>
                <button type="button" class="btn-op" onclick="hitung('*')">×</button>
                <button type="button" class="btn-op" onclick="hitung('/')">÷</button>
            </div>

            <button type="button" id="btnReset" class="btn-reset">Reset Kalkulator</button>

            <div class="result-box">
                <h4>HASIL KALKULASI:</h4>
                <div id="hasilKalkulasi">0</div>
            </div>
        </div>

        <div class="footer-text">
            &copy; 2026 Marcellino Putra Kurniawan (3126510020) | D3 PJJ TI'26
        </div>
    </div>

    <script>
        document.getElementById("btnReset").addEventListener("click", function () {
            document.getElementById("angka1").value = "";
            document.getElementById("angka2").value = "";
            document.getElementById("hasilKalkulasi").innerText = "0";
        });
    </script>
</body>

</html>
